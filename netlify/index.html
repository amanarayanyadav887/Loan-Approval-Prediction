<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loan Approval Prediction</title>
  <style>
    :root { color-scheme: light; --ink:#172033; --muted:#64748b; --line:#e2e8f0; --blue:#2457d6; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Inter,Segoe UI,Arial,sans-serif; background:#f3f6fb; color:var(--ink); }
    .wrap { max-width:980px; margin:42px auto; padding:0 18px; }
    .hero { margin-bottom:22px; }
    .eyebrow { color:var(--blue); font-size:12px; font-weight:800; letter-spacing:1.6px; text-transform:uppercase; }
    h1 { margin:8px 0; font-size:clamp(28px,4vw,38px); }
    .sub { color:var(--muted); line-height:1.6; margin:0; }
    .layout { display:grid; grid-template-columns:1.2fr .8fr; gap:20px; align-items:start; }
    .panel { background:#fff; border:1px solid var(--line); border-radius:18px; padding:25px; box-shadow:0 10px 30px rgba(25,45,90,.05); }
    h2 { margin:0 0 18px; font-size:19px; }
    .fields { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
    label { display:block; font-size:13px; font-weight:700; margin-bottom:7px; }
    input,select { width:100%; padding:13px 12px; border:1px solid #cbd5e1; border-radius:10px; background:white; font-size:15px; color:var(--ink); outline:none; }
    input:focus,select:focus { border-color:var(--blue); box-shadow:0 0 0 3px rgba(36,87,214,.12); }
    .full { grid-column:1/-1; }
    button { width:100%; border:0; border-radius:11px; padding:14px 18px; background:var(--blue); color:white; font-size:15px; font-weight:800; cursor:pointer; margin-top:20px; }
    button:disabled { opacity:.65; cursor:wait; }
    .hint { color:var(--muted); font-size:12px; margin-top:6px; }
    .result { min-height:170px; display:flex; flex-direction:column; justify-content:center; }
    .placeholder { color:var(--muted); line-height:1.6; }
    .result h3 { font-size:21px; margin:8px 0; }
    .prob { font-size:34px; font-weight:850; margin:8px 0 2px; }
    .small { color:var(--muted); font-size:12px; line-height:1.55; }
    .error { color:#b42318; background:#fff1f0; padding:11px 12px; border-radius:9px; margin-top:14px; display:none; }
    .disclaimer { margin-top:18px; padding:14px 16px; border:1px solid #f0d9a8; background:#fff9eb; border-radius:12px; color:#75521b; font-size:12px; line-height:1.6; }
    @media(max-width:720px) { .layout { grid-template-columns:1fr; } .fields { grid-template-columns:1fr; } .full { grid-column:auto; } .wrap { margin:24px auto; } }
  </style>
</head>
<body>
  <main class="wrap">
    <header class="hero">
      <div class="eyebrow">ML project by Aman Narayan</div>
      <h1>Loan Approval Prediction</h1>
      <p class="sub">Enter applicant financial details to view the Logistic Regression model's prediction.</p>
    </header>

    <section class="layout">
      <div class="panel">
        <h2>Applicant details</h2>
        <form id="loanForm">
          <div class="fields">
            <div>
              <label for="income">Annual income (₹)</label>
              <input id="income" type="number" min="0" step="any" placeholder="e.g. 500000" required>
            </div>
            <div>
              <label for="loan_amount">Loan amount (₹)</label>
              <input id="loan_amount" type="number" min="0" step="any" placeholder="e.g. 250000" required>
            </div>
            <div>
              <label for="credit_score">Credit score</label>
              <input id="credit_score" type="number" min="300" max="850" step="1" placeholder="300–850" required>
              <div class="hint">Accepted range: 300 to 850</div>
            </div>
            <div>
              <label for="employment_type">Employment type</label>
              <select id="employment_type" required>
                <option value="Salaried">Salaried</option>
                <option value="Self-Employed">Self-Employed</option>
                <option value="Unemployed">Unemployed</option>
              </select>
            </div>
          </div>
          <button id="submitBtn" type="submit">Predict loan outcome</button>
          <div id="error" class="error" role="alert"></div>
        </form>
      </div>

      <aside class="panel result" aria-live="polite">
        <div class="eyebrow">Prediction result</div>
        <div id="resultContent" class="placeholder">Your prediction will appear here after you submit the applicant details.</div>
      </aside>
    </section>

    
  </main>

<script src="/config.js"></script>
<script>
const API_BASE_URL = (window.API_BASE_URL || '').replace(/\\/$/, '');
const form = document.getElementById('loanForm');
const button = document.getElementById('submitBtn');
const errorBox = document.getElementById('error');
const resultContent = document.getElementById('resultContent');

form.addEventListener('submit', async (event) => {
  event.preventDefault();
  errorBox.style.display = 'none';
  button.disabled = true;
  button.textContent = 'Calculating…';

  const payload = {
    income: document.getElementById('income').value,
    loan_amount: document.getElementById('loan_amount').value,
    credit_score: document.getElementById('credit_score').value,
    employment_type: document.getElementById('employment_type').value
  };

  try {
    const response = await fetch(`${API_BASE_URL}/api/predict`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(payload)
    });
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || 'Unable to calculate prediction.');

    const probability = data.approval_probability == null
      ? 'Not available'
      : (data.approval_probability * 100).toFixed(1) + '%';

    resultContent.innerHTML = `
      <h3>${data.label}</h3>
      <div class="prob">${probability}</div>
      <div class="small">Model-estimated probability for class 1 (LoanApproved = 1).</div>
      <p class="small">Prediction class: <strong>${data.prediction}</strong></p>
    `;
  } catch (error) {
    errorBox.textContent = error.message;
    errorBox.style.display = 'block';
  } finally {
    button.disabled = false;
    button.textContent = 'Predict loan outcome';
  }
});
</script>
</body>
</html>
